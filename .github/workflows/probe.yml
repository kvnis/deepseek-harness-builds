name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Create a release the way the build does
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo hi > probe.txt
          gh release create dsh-v0.0.0-probe2 probe.txt --title "probe" --notes "probe" \
            --target "$(git rev-parse HEAD)" --latest=false
          echo "created"
          gh release delete dsh-v0.0.0-probe2 --yes --cleanup-tag
          echo "deleted"
