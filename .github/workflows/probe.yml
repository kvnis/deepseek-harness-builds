name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Create and delete a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name=dsh-v0.0.0-probe -f name=probe -F draft=true --jq '.id')
          echo "created $id"
          gh api -X DELETE "repos/$GH_REPO/releases/$id"
          echo "deleted"
