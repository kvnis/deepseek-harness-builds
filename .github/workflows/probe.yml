name: probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Try the failing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo hi > probe.txt
          gh release create dsh-v0.2.1-alpha.3 probe.txt --title "probe" --notes "probe" \
            --target "$(git rev-parse HEAD)" --latest=false && echo CREATED
          gh release delete dsh-v0.2.1-alpha.3 --yes --cleanup-tag
